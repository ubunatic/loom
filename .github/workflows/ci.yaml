name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install lint tools
        run: make lint-tools
      - name: Lint
        run: make lint
      - name: Build
        run: go build ./...
      - name: Test with race detector
        id: race
        run: go test -race -json ./... | tee test.json
      - name: Summarize race test failures
        if: always() && steps.race.outcome == 'failure'
        run: python3 scripts/summarize-go-test-json.py test.json
