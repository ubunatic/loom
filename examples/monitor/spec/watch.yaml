# yaml-language-server: $schema=../../../spec/schemas/watch.schema.json
collect: 1s
redraw: 50ms
clock_format: '15:04:05'
title: '{{.Title}}  {{.Time}}'
status: Watch
command: monitor
description: Render the declared Loom monitor once or watch its clock
watch_help: Watch the clock until quit
width_help: Show-once width in terminal cells (otherwise use the declaration)
collectors:
  - id: cpu
    type: file
    path: /proc/stat
    rate: 1s
