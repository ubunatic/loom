# yaml-language-server: $schema=../../../spec/schemas/monitor.schema.json
app:
  height: 11
  max_width: 80
view:
  name: main
  frame:
    title: Loom monitor
    status: Show once
    gap: 2
    breakpoint: 64
    control_separator: '  '
    actions:
      - id: toggle_usage
        action: toggle
        key: u
        target: usage
        title_hint: '[u] '
        hint: '[u]usage:on'
        hidden_hint: '[u]usage:off'
      - id: toggle_load
        action: toggle
        key: l
        target: load
        title_hint: '[l] '
        hint: '[l]load:on'
        hidden_hint: '[l]load:off'
      - id: quit
        action: quit
        key: q
        hint: '[q]quit'
      - id: interrupt
        action: quit
        key: ctrl-c
    boxes:
      - id: usage
        title: All Usage
        width: 31
        height: 9
        padding: 1
        rows:
          gap: 1
          ellipsis: '...'
          columns:
            - {width: 8, align: left}
            - {width: 6, align: left}
            - {width: 4, align: right}
            - {width: 6, align: left}
          values:
            - ['Claude', '[⣿⣿  ]', '60%', '[    ]']
            - ['Gemini', '[⣿⣿⣿⡇]', '95%', '[    ]']
            - ['Claude/G', '[⣿⣿⣿⡇]', '99%', '[    ]']
            - ['OpenAI', '[⣿⡇  ]', '41%', '[    ]']
            - ['sim', 'graphs sim', '', '']
      - id: load
        title: Load
        width: 31
        height: 9
        padding: 1
        rows:
          gap: 1
          ellipsis: '...'
          columns:
            - {width: 9, align: left}
            - {width: 12, align: left}
            - {width: 4, align: right}
          values:
            - ['cpu (16c)', '[⣠⣀⣀⣀⣀⣀⣀⣄⣀⣀]', '1%']
            - ['ram (45G)', '[⣤⣤⣤⣤⣤⣤⣤⣤⣤⣤]', '36%']
            - ['gpu (Phx)', '[⣀⣀⣀⣀⣀⣀⣀⣀⣀⣀]', '0%']
            - ['vram/gtt', '[⣿⣿⣿⣿][⣀⣀⣀⣀]', '6%']
            - ['CPU real', 'graphs sim', '']
