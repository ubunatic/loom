# yaml-language-server: $schema=../../../spec/schemas/monitor.schema.json
app:
  height: 9
  max_width: 64
view:
  name: main
  frame:
    title: Loom monitor
    status: Show once
    gap: 2
    breakpoint: 64
    control_separator: '  '
    actions:
      - id: toggle_usage
        action: toggle
        key: u
        target: usage
        title_hint: '[u] '
        hint: '[u]usage:on'
        hidden_hint: '[u]usage:off'
      - id: toggle_load
        action: toggle
        key: l
        target: load
        title_hint: '[l] '
        hint: '[l]load:on'
        hidden_hint: '[l]load:off'
      - id: quit
        action: quit
        key: q
        hint: '[q]quit'
      - id: interrupt
        action: quit
        key: ctrl-c
    boxes:
      - id: usage
        title: All Usage
        width: 31
        height: 7
        padding: 1
        rows:
          gap: 1
          ellipsis: '...'
          columns:
            - {width: 13, align: left}
            - {width: 4, align: right}
            - {width: 7, align: left}
          values:
            - ['Claude Code', '60%', '2d20h']
            - ['Gemini', '95%', '1d2h']
            - ['OpenAI Codex', '41%', '5d12h']
      - id: load
        title: Load
        width: 31
        height: 7
        padding: 1
        rows:
          gap: 1
          ellipsis: '...'
          columns:
            - {width: 13, align: left}
            - {width: 4, align: right}
            - {width: 7, align: left}
          values:
            - ['cpu (16c)', '1%', '47 C']
            - ['ram (45G)', '36%', '16.4G']
            - ['gpu (Phoenix)', '3%', '31 C']
