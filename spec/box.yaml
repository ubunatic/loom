# yaml-language-server: $schema=schemas/box.schema.json
# Default style (Sharp) for backward compatibility
top_left: "┌"
top_right: "┐"
bottom_left: "└"
bottom_right: "┘"
horizontal: "─"
vertical: "│"
title_prefix: " "
title_suffix: " "

# BoxBorderStyle glyph sets (issue 037); tee and cross joints draw table
# dividers (issue 310)
styles:
  sharp:
    top_left: "┌"
    top_right: "┐"
    bottom_left: "└"
    bottom_right: "┘"
    horizontal: "─"
    vertical: "│"
    tee_top: "┬"
    tee_bottom: "┴"
    tee_left: "├"
    tee_right: "┤"
    cross: "┼"
  rounded:
    top_left: "╭"
    top_right: "╮"
    bottom_left: "╰"
    bottom_right: "╯"
    horizontal: "─"
    vertical: "│"
    tee_top: "┬"
    tee_bottom: "┴"
    tee_left: "├"
    tee_right: "┤"
    cross: "┼"
  double:
    top_left: "╔"
    top_right: "╗"
    bottom_left: "╚"
    bottom_right: "╝"
    horizontal: "═"
    vertical: "║"
    tee_top: "╦"
    tee_bottom: "╩"
    tee_left: "╠"
    tee_right: "╣"
    cross: "╬"
  ascii:
    top_left: "+"
    top_right: "+"
    bottom_left: "+"
    bottom_right: "+"
    horizontal: "-"
    vertical: "|"
    tee_top: "+"
    tee_bottom: "+"
    tee_left: "+"
    tee_right: "+"
    cross: "+"
