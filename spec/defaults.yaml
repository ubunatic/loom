# yaml-language-server: $schema=schemas/defaults.schema.json
collector:
  default_retention: 15m

# keycaps.modifiers: glyphs in display order.
keycaps:
  modifiers:
    - {name: shift, glyph: "⇧"}
    - {name: ctrl, glyph: "⌃"}
    - {name: alt, glyph: "⌥"}

# Keys that close the app unless the widget consumes them or the pane opts out.
quit_keys:
  - ctrl-q
  - f10
# Opt-in: an unhandled Esc closes the app.
escape_quits: false

pane:
  max_cols: 50
  esc_key_timeout: 50ms
  guard_duration: 1s
  view_pan_step: 10
  # Opt-in kitty keyboard protocol (flag 1) so shift-enter, ctrl-enter, ctrl-i differ.
  kitty_keyboard: false

scrollbar:
  mode: auto
  foreground_char: "▓" # position marker (thumb)
  background_char: "░" # clickable track

mouse:
  double_click_interval: 400ms
  movement_tolerance: 1

splash:
  bracket_width: 24
  pill_gap: 2
  footer_text: "Esc to skip"
  step_text: "initializing..."
  tick_interval: 80ms
  hold_duration: 400ms

spinner:
  tick_interval: 80ms

graph:
  default_background_ansi: "100"
  bar:
    max_width: 10
  sparkline:
    glyphs: "▁▂▃▄▅▆▇█"
  stacked_bar:
    glyphs: "█▓▒░"
  treemap:
    glyphs: "█▓▒░"
  spinner:
    frames: "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
    harnez_frames: "⠙⠹⠸⠼⠴⠦⠧⠇⠏⠋"

clock:
  start: "Start"
  stop: "Stop"
  reset: "Reset"

paint_canvas:
  tune_label: "Tune"
  smoothing_label: "Smoothing"
  smoothing_levels: [0, 1, 2]

progress_bar:
  width: 24
  done_pattern: ":"
  demo_interval: 150ms
  demo_step: 10

media:
  loading_label: "loading"
  render_error_label: "render error"
  loading_threshold: 50ms

editor:
  search_regex: false
  search_case_insensitive: true
  screenshot_first_number: 1
  screenshot_safe_characters: ".-_"
  screenshot_replacement: "-"
  config_directory: "loom"
  config_file: "editor.yaml"
  config_fallback_directory: ".config"
  title: "loom edit"
  initial_height: 24
  max_cols: 0
  resizeable: true
  show_file_bar: true
  show_side_panel: false
  browser_max_width: 24
  browser_width_divisor: 3
  browser_min_width: 10
  browser_narrow_divisor: 2
  search_max_width: 48
  search_max_height: 7
  footer_min_height: 6
  show_status_bar: true
  show_hints: true
  title_prefix: "─ "
  title_suffix: " "
  divider_glyph: "─"
  browser_divider_glyph: "│"
  position_format: "Ln %d, Col %d"
  truncation: "..."
  saved_prefix: "Saved: "
  unsaved_title: "Save changes?"
  unsaved_message: "Save changes to %s before closing?"
  save_label: "Save"
  discard_label: "Discard"
  cancel_label: "Cancel"
  search_title: "Search  F3 / ^F"
  invalid_regex: "Invalid regex"
  no_matches: "No matches"
  match_format: "%d / %d matches"
  search_navigation_hint: "Enter: next   S-Enter: prev"
  normal_label: "Normal"
  regex_label: "Regex"
  mode_marker: " *"
  regex_key_cap: "^R"
  screenshot_directory: ["Pictures", "Screenshots"]
  screenshot_marker: "-loom-edit-"
  screenshot_number_width: 2
  screenshot_extension: ".ansi"
  screenshot_untitled: "document"
  screenshot_width: 100
  screenshot_height: 24
  screenshot_directory_mode: 0o755
  screenshot_file_mode: 0o644
  screenshot_saved_prefix: "Saved screenshot: "
  box_drop_priority: 1
  screenshot_drop_priority: 2
  status_icons:
    theme: "◐"
    mouse_on: "M"
    mouse_off: "m"
    alt_on: "A"
    alt_off: "a"
    fg: 15
    bg: 239
  theme: "julia256"
  mousegrab: false
  altscreen: true
  hotkey_files_key: "^O"
  hotkey_files_binding: "ctrl-o"
  hotkey_files_secondary_binding: "f2"
  hotkey_files_label: "Files"
  hotkey_search_key: "^F"
  hotkey_search_binding: "ctrl-f"
  hotkey_search_secondary_binding: "f3"
  hotkey_search_label: "Search"
  hotkey_save_key: "^S"
  hotkey_box_key: "^D"
  hotkey_box_binding: "ctrl-d"
  hotkey_box_label: "Box"
  search_prompt: "Find: "
  search_placeholder: "type query..."
  hotkey_screenshot_binding: "ctrl-p"
  hotkey_screenshot_label: "Screenshot"

search_bar:
  prompt: "> "
  placeholder: "type to filter"

number_input:
  step: 1.0
  left_glyph: "◂"
  right_glyph: "▸"
  invalid_error: "invalid number"
  below_min_fmt: "%s is below the minimum %s"
  above_max_fmt: "%s is above the maximum %s"

toggle:
  on_mark: "[✓]"
  off_mark: "[ ]"

paginator:
  active_dot: "●"
  inactive_dot: "○"
  numeric_format: "%d/%d"

tree:
  collapsed_marker: "▶ "
  expanded_marker: "▼ "
  leaf_marker: "  "

split:
  vertical_divider: "─"
  horizontal_divider: "│"
  default_ratio: 0.5
  default_gap: 1

choice:
  default_placeholder: "type to filter"
  selection_marker: "▶ "
  unselected_marker: "  "
  checked_marker: "[✓] "
  unchecked_marker: "[ ] "

table:
  sort_asc_glyph: "▲"
  sort_desc_glyph: "▼"
  controls_hint_fmt: "[tab:%s%s !:flip]"

rich_text_edit:
  bindings:
    up: ["up"]
    down: ["down"]
    left: ["left"]
    right: ["right"]
    cancel: ["esc"]
    tab: ["tab"]
    reverse_tab: ["shift-tab"]
    focus: ["tab", "shift-tab"]
    selection_italic: ["tab", "ctrl-i"]
    search_next: ["enter"]
    search_previous: ["shift-enter"]
    regex: ["ctrl-r"]
    newline: ["enter", "return"]
    box_exit: ["esc", "enter", "return"]
    bold: ["ctrl-b"]
    italic: ["ctrl-i"]
    underline: ["ctrl-u"]
    copy: ["ctrl-c", "ctrl-insert"]
    cut: ["ctrl-x", "shift-delete"]
    paste: ["ctrl-v", "shift-insert"]
    undo: ["ctrl-z", "ctrl-y"]
    redo: ["ctrl-r", "ctrl-shift-y", "ctrl-shift-z"]
    history: ["ctrl-z", "ctrl-y", "ctrl-r", "ctrl-shift-y", "ctrl-shift-z"]
    move_left: ["left", "shift-left"]
    move_right: ["right", "shift-right"]
    move_up: ["up", "shift-up"]
    move_down: ["down", "shift-down"]
    select_left: ["shift-left"]
    select_right: ["shift-right"]
    select_up: ["shift-up"]
    select_down: ["shift-down"]
    line_start: ["home", "shift-home", "ctrl-a", "ctrl-shift-a"]
    line_end: ["end", "shift-end", "ctrl-e", "ctrl-shift-e"]
    select_start: ["shift-home", "ctrl-shift-a"]
    select_end: ["shift-end", "ctrl-shift-e"]
    word_left: ["ctrl-left"]
    word_right: ["ctrl-right"]
    delete_before: ["backspace"]
    delete_after: ["delete"]
    arrows: ["left", "right", "up", "down"]
    menu_focus: ["tab", "shift-tab", "backtab"]
    menu_reverse: ["shift-tab", "backtab"]
    horizontal: ["left", "right"]
    vertical: ["up", "down"]
    activate: ["enter", "return", "space", " "]
    submenu_move: ["tab", "shift-tab", "backtab", "up", "down", "left", "right"]
    submenu_reverse: ["shift-tab", "backtab", "up", "left"]
    page_up: ["pgup", "pageup"]
    page_down: ["pgdn", "pgdown", "pagedown"]
    home: ["home"]
    end: ["end"]
    view_navigation: ["ctrl-c", "ctrl-insert", "left", "shift-left", "right", "shift-right", "up", "shift-up", "down", "shift-down", "home", "shift-home", "end", "shift-end", "ctrl-a", "ctrl-shift-a", "ctrl-e", "ctrl-shift-e", "ctrl-left", "ctrl-right"]
  undo_limit: 100
  multi_click_window: "400ms"
  show_cursor: true
  show_popover: true
  help_title: "RichTextEdit Help"
  help_max_width: 72
  help_max_height: 18
  help_page_step: 5
  help_footer: "↑/↓ Scroll · Esc Close"
  save_title: "Save as"
  file_mode: 0o644
  final_newline: true
  create_missing_file: true
  view_label: "View"
  edit_label: "Edit"
  untitled_name: "Untitled"
  box_hint: "[Box] Enter/Esc exits"
  status_separator: " · "
  status_truncation: "…"
  popover_min_width: 18
  action_closes_menu: true
  menu_focus_key: ""
  arrows_cancel_unfocused_menu: true
  unselect_after_action: false
  unselect_on_cancel: false
  popup_open_key: "ctrl-space"
  auto_popup_on_selection: true
  popup_open_delay_ms: 0
  cycle_navigation: true
  position_preference: "smart"
  dismiss_on_scroll: true
  mouse_hover_focus: false
  selection_bg: 24
  toolbar_fg: 15
  toolbar_bg: 239
  separator_glyph: "│"
  separator_fg: 8
  separator_bg: 239
  pointer_up_glyph: "▲"
  pointer_down_glyph: "▼"
  pointer_fg: 8
  popover_labels: ["B", "I", "U", "S", "Link", "#FG", "#BG", "Box"]
  box_draw_label: "Draw"
  box_style_labels: ["Plain", "Rounded"]
  box_style_default: "plain"
  ghost_cursor_enabled: false
  popover_focus_fg: 15
  popover_focus_bg: 24
  link_fg: 39
  link_underline: true
  save_popup_max_width: 72
  save_popup_max_height: 18
  state_untitled_label: "Unsaved"
  state_saved_label: "Saved"
  state_modified_label: "Modified"
  state_error_label: "Error"
  file_menu_title: "File"
  file_menu_mnemonic: "F"
  hotkey_help_binding: "f1"
  hotkey_help_label: "Help"
  hotkey_save_binding: "ctrl-s"
  hotkey_save_label: "Save"
  hotkey_save_as_label: "Save as"
  hotkey_open_binding: "ctrl-o"
  hotkey_open_label: "Open"
  hotkey_close_binding: "ctrl-w"
  hotkey_close_label: "Close"
  hotkey_view_edit_binding: "f7"
  hotkey_quit_binding: "f10"
  hotkey_quit_label: "Quit"
  help_sections:
    - title: "File"
      entries:
        - {ref: "HotkeyOpen"}
        - {ref: "HotkeyClose"}
        - {ref: "HotkeySave"}
        - {keys: ["alt-f"], label: "File menu (arrows choose, Enter runs, Esc closes)"}
    - title: "Navigation"
      entries:
        - {cap: "←↑↓→", label: "Move cursor"}
        - {keys: ["ctrl-left", "ctrl-right"], label: "Move by word"}
        - {keys: ["home", "ctrl-a"], label: "Line start"}
        - {keys: ["end", "ctrl-e"], label: "Line end"}
    - title: "Selection"
      entries:
        - {cap: "⇧←↑↓→", label: "Extend selection"}
        - {keys: ["shift-home", "shift-end"], label: "Select to line start/end"}
        - {keys: ["ctrl-shift-a", "ctrl-shift-e"], label: "Extend to line start/end"}
        - {cap: "Drag", label: "Select with the mouse; double-click word, triple-click line"}
    - title: "Editing"
      entries:
        - {keys: ["enter"], label: "New line"}
        - {keys: ["backspace", "delete"], label: "Erase"}
        - {keys: ["ctrl-c", "ctrl-insert"], label: "Copy"}
        - {keys: ["ctrl-x", "shift-delete"], label: "Cut"}
        - {keys: ["ctrl-v", "shift-insert"], label: "Paste"}
        - {keys: ["ctrl-z"], label: "Undo"}
        - {keys: ["ctrl-y", "ctrl-r", "ctrl-shift-z"], label: "Redo"}
    - title: "Formatting"
      entries:
        - {keys: ["ctrl-b"], label: "Bold"}
        - {keys: ["tab", "ctrl-i"], label: "Italic (selected text)"}
        - {keys: ["ctrl-u"], label: "Underline"}
        - {keys: ["ctrl-space"], label: "Formatting popover (arrow towards toolbar focuses, Tab or arrows choose, Enter applies, Esc closes)"}
    - title: "Modes and boxes"
      entries:
        - {keys: ["f7"], label: "Toggle View/Edit"}
        - {keys: ["ctrl-d"], label: "Box selection, or toggle box drawing"}
        - {cap: "←↑↓→", label: "While drawing: draw connected lines; Enter or Esc finishes"}
    - title: "Save as dialog"
      entries:
        - {keys: ["tab", "shift-tab"], label: "Switch between search and filename"}
        - {keys: ["enter"], label: "Open folder or save"}
        - {keys: ["backspace"], label: "Edit search, or go to parent folder"}
        - {keys: ["esc"], label: "Cancel"}
    - title: "Help"
      entries:
        - {ref: "HotkeyHelp"}
