# yaml-language-server: $schema=schemas/defaults.schema.json
# keycaps.modifiers: glyphs in display order; KeyCap(binding) renders ctrl-alt-s as ⌃⌥S.
keycaps:
  modifiers:
    - {name: shift, glyph: "⇧"}
    - {name: ctrl, glyph: "⌃"}
    - {name: alt, glyph: "⌥"}

# Keys that close the app unless the widget consumes them or the pane opts out.
quit_keys:
  - ctrl-q
  - f10
# Opt-in: an unhandled Esc closes the app.
escape_quits: false

pane:
  max_cols: 50
  esc_key_timeout: 50ms
  guard_duration: 1s
  view_pan_step: 10

scrollbar:
  mode: auto
  foreground_char: "▓" # position marker (thumb)
  background_char: "░" # clickable track

mouse:
  double_click_interval: 400ms
  movement_tolerance: 1

splash:
  bracket_width: 24
  pill_gap: 2
  footer_text: "Esc to skip"
  step_text: "initializing..."
  tick_interval: 80ms
  hold_duration: 400ms

spinner:
  tick_interval: 80ms

clock:
  start: "Start"
  stop: "Stop"
  reset: "Reset"

paint_canvas:
  tune_label: "Tune"
  smoothing_label: "Smoothing"
  smoothing_levels: [0, 1, 2]

progress_bar:
  width: 24
  done_pattern: ":"
  demo_interval: 150ms
  demo_step: 10

media:
  loading_label: "loading"
  render_error_label: "render error"
  loading_threshold: 50ms

editor:
  status_icons:
    theme: "◐"
    mouse_on: "M"
    mouse_off: "m"
    alt_on: "A"
    alt_off: "a"
    fg: 15
    bg: 239
  theme: "plain"
  mousegrab: false
  altscreen: true
  hotkey_files_key: "^O"
  hotkey_files_binding: "ctrl-o"
  hotkey_files_secondary_binding: "f2"
  hotkey_files_label: "Files"
  hotkey_search_key: "^F"
  hotkey_search_binding: "ctrl-f"
  hotkey_search_secondary_binding: "f3"
  hotkey_search_label: "Search"
  hotkey_save_key: "^S"
  hotkey_box_key: "^D"
  hotkey_box_binding: "ctrl-d"
  hotkey_box_label: "Box"
  search_prompt: "Find: "
  search_placeholder: "type query..."
  hotkey_screenshot_binding: "ctrl-p"
  hotkey_screenshot_label: "Screenshot"

search_bar:
  prompt: "> "
  placeholder: "type to filter"

rich_text_edit:
  selection_bg: 24
  toolbar_fg: 15
  toolbar_bg: 239
  separator_glyph: "│"
  separator_fg: 8
  separator_bg: 239
  pointer_up_glyph: "▲"
  pointer_down_glyph: "▼"
  pointer_fg: 8
  popover_labels: ["B", "I", "U", "S", "Link", "#FG", "#BG", "Box"]
  box_draw_label: "Draw"
  box_style_labels: ["Plain", "Rounded"]
  box_style_default: "plain"
  ghost_cursor_enabled: false
  popover_focus_fg: 15
  popover_focus_bg: 24
  link_fg: 39
  link_underline: true
  save_popup_max_width: 72
  save_popup_max_height: 18
  state_untitled_label: "Unsaved"
  state_saved_label: "Saved"
  state_modified_label: "Modified"
  state_error_label: "Error"
  file_menu_title: "File"
  file_menu_mnemonic: "F"
  hotkey_help_binding: "f1"
  hotkey_help_label: "Help"
  hotkey_save_binding: "ctrl-s"
  hotkey_save_label: "Save"
  hotkey_save_as_binding: "ctrl-alt-s"
  hotkey_save_as_label: "Save as"
  hotkey_open_binding: "ctrl-o"
  hotkey_open_label: "Open"
  hotkey_close_binding: "ctrl-w"
  hotkey_close_label: "Close"
  hotkey_view_edit_binding: "f7"
  hotkey_quit_binding: "f10"
  hotkey_quit_label: "Quit"
  help_sections:
    - title: "File"
      entries:
        - {ref: "HotkeyOpen"}
        - {ref: "HotkeyClose"}
        - {ref: "HotkeySave"}
        - {ref: "HotkeySaveAs"}
        - {keys: ["alt-f"], label: "File menu (arrows choose, Enter runs, Esc closes)"}
    - title: "Navigation"
      entries:
        - {cap: "←↑↓→", label: "Move cursor"}
        - {keys: ["ctrl-left", "ctrl-right"], label: "Move by word"}
        - {keys: ["home", "ctrl-a"], label: "Line start"}
        - {keys: ["end", "ctrl-e"], label: "Line end"}
    - title: "Selection"
      entries:
        - {cap: "⇧←↑↓→", label: "Extend selection"}
        - {keys: ["shift-home", "shift-end"], label: "Select to line start/end"}
        - {keys: ["ctrl-shift-a", "ctrl-shift-e"], label: "Extend to line start/end"}
        - {cap: "Drag", label: "Select with the mouse; double-click word, triple-click line"}
    - title: "Editing"
      entries:
        - {keys: ["enter"], label: "New line"}
        - {keys: ["backspace", "delete"], label: "Erase"}
        - {keys: ["ctrl-c", "ctrl-insert"], label: "Copy"}
        - {keys: ["ctrl-x", "shift-delete"], label: "Cut"}
        - {keys: ["ctrl-v", "shift-insert"], label: "Paste"}
        - {keys: ["ctrl-z"], label: "Undo"}
        - {keys: ["ctrl-y", "ctrl-r", "ctrl-shift-z"], label: "Redo"}
    - title: "Formatting"
      entries:
        - {keys: ["ctrl-b"], label: "Bold"}
        - {keys: ["ctrl-i"], label: "Italic"}
        - {keys: ["ctrl-u"], label: "Underline"}
        - {keys: ["ctrl-space"], label: "Formatting popover (Tab or arrows choose, Enter applies, Esc closes)"}
    - title: "Modes and boxes"
      entries:
        - {keys: ["f7"], label: "Toggle View/Edit"}
        - {keys: ["ctrl-d"], label: "Box selection, or toggle box drawing"}
        - {cap: "←↑↓→", label: "While drawing: draw connected lines; Esc ends a stroke"}
    - title: "Save as dialog"
      entries:
        - {keys: ["tab", "shift-tab"], label: "Switch between search and filename"}
        - {keys: ["enter"], label: "Open folder or save"}
        - {keys: ["backspace"], label: "Edit search, or go to parent folder"}
        - {keys: ["esc"], label: "Cancel"}
    - title: "Help"
      entries:
        - {ref: "HotkeyHelp"}
