# yaml-language-server: $schema=schemas/defaults.schema.json
fallback_quit_keys:
  - esc
  - ctrl-c
  - ctrl-q
  - ctrl-d
  - q

pane:
  max_cols: 50
  esc_key_timeout: 50ms
  guard_duration: 1s
  view_pan_step: 10

scrollbar:
  mode: auto
  foreground_char: "▓" # position marker (thumb)
  background_char: "░" # clickable track

mouse:
  double_click_interval: 400ms
  movement_tolerance: 1

splash:
  bracket_width: 24
  pill_gap: 2
  footer_text: "Esc to skip"
  step_text: "initializing..."
  tick_interval: 80ms
  hold_duration: 400ms

spinner:
  tick_interval: 80ms

clock:
  start: "Start"
  stop: "Stop"
  reset: "Reset"

paint_canvas:
  tune_label: "Tune"
  smoothing_label: "Smoothing"
  smoothing_levels: [0, 1, 2]

progress_bar:
  width: 24
  done_pattern: ":"
  demo_interval: 150ms
  demo_step: 10

media:
  loading_label: "loading"
  render_error_label: "render error"
  loading_threshold: 50ms

search_bar:
  prompt: "> "
  placeholder: "type to filter"

rich_text_edit:
  selection_bg: 24
  toolbar_fg: 15
  toolbar_bg: 239
  separator_glyph: "│"
  separator_fg: 8
  separator_bg: 239
  pointer_up_glyph: "▲"
  pointer_down_glyph: "▼"
  pointer_fg: 8
  popover_labels: ["B", "I", "U", "S", "Link", "#FG", "#BG", "Box"]
  link_fg: 39
  link_underline: true
