# yaml-language-server: $schema=schemas/themes.schema.json
# Loom widget color themes.
#
# Each theme defines named color roles used by widget style structs
# (ChoiceStyle, TableStyle, etc.). Values may be palette indices or explicit
# six-digit true-color RGB values.
#
# Use "default" for the terminal default (reset), or an integer from 0 to 255
# to force a specific palette entry.

themes:
  # plain — terminal-default colors; visually identical to the current
  # hard-coded DefaultChoiceStyle / DefaultTableStyle behavior.
  plain:
    normal_fg:        default
    normal_bg:        default
    selected_fg:      default # bold carries the highlight
    selected_bg:      default
    selected_bold:    true
    header_fg:        default
    header_bg:        default
    header_bold:      true
    prompt_fg:        default
    prompt_bg:        default
    placeholder_fg:   default
    placeholder_bg:   default
    placeholder_dim:  true # rely on terminal faint rendering only in the plain theme
    scrollbar_track_fg: default
    scrollbar_track_bg: default
    scrollbar_track_dim: true
    scrollbar_thumb_fg: default
    scrollbar_thumb_bg: default
    scrollbar_thumb_bold: true
    status_fg:        default
    status_bg:        default
    status_bold:      false
    status_dim:       false
    border_fg:        default
    border_bg:        default
    focus_bg:         238 # dark grey cell highlight; NewGrid's default sources this value

  # mc — muted Midnight Commander blue-panel palette.
  # Panel body: soft white on saturated steel blue (indices 252 / 69).
  # Selected row and prompt: black on bright sky blue (indices 16 / 75).
  # Header row: muted yellow on steel blue (bold).
  # Border / title bar: soft white on steel blue.
  mc:
    normal_fg:        252 # soft white (#d0d0d0)
    normal_bg:        69  # saturated steel blue (#5f87ff)
    selected_fg:      16  # fixed black (#000000)
    selected_bg:      75  # bright sky blue (#5fafff)
    selected_bold:    false
    header_fg:        186 # muted yellow (#d7d787)
    header_bg:        69  # medium steel blue
    header_bold:      true
    prompt_fg:        16  # fixed black
    prompt_bg:        75  # muted cyan
    placeholder_fg:   243 # medium grey (#767676), lower contrast than active input
    placeholder_bg:   75  # muted cyan
    placeholder_dim:  false
    scrollbar_track_fg: 69 # panel blue; dim creates a terminal-adaptive shade
    scrollbar_track_bg: 69 # panel blue
    scrollbar_track_dim: true
    scrollbar_thumb_fg: 75 # muted cyan
    scrollbar_thumb_bg: 69 # panel blue
    scrollbar_thumb_bold: false
    status_fg:        252 # soft white
    status_bg:        69  # panel blue
    status_bold:      false
    status_dim:       false
    border_fg:        252 # soft white
    border_bg:        69  # medium steel blue
    focus_bg:         75  # bright sky blue (#5fafff) for focused grid cells

  # mc-classic — vivid fixed-palette rendering of the classic MC colors.
  mc-classic:
    normal_fg:        231 # white (#ffffff)
    normal_bg:        27  # blue (#005fd7)
    selected_fg:      16  # black (#000000)
    selected_bg:      51  # cyan (#00ffff)
    selected_bold:    false
    header_fg:        226 # yellow (#ffff00)
    header_bg:        27
    header_bold:      true
    prompt_fg:        16
    prompt_bg:        51
    placeholder_fg:   243
    placeholder_bg:   51
    placeholder_dim:  false
    scrollbar_track_fg: 33
    scrollbar_track_bg: 27
    scrollbar_track_dim: false
    scrollbar_thumb_fg: 51
    scrollbar_thumb_bg: 27
    scrollbar_thumb_bold: false
    status_fg:        231
    status_bg:        27
    status_bold:      false
    status_dim:       false
    border_fg:        231
    border_bg:        27
    focus_bg:         33

  # mc-dark — darker navy panels with restrained cyan accents.
  mc-dark:
    normal_fg:        252 # soft white (#d0d0d0)
    normal_bg:        19  # navy (#0000af)
    selected_fg:      16
    selected_bg:      37  # dark cyan (#00afaf)
    selected_bold:    false
    header_fg:        186
    header_bg:        19
    header_bold:      true
    prompt_fg:        16
    prompt_bg:        37
    placeholder_fg:   238
    placeholder_bg:   37
    placeholder_dim:  false
    scrollbar_track_fg: 18
    scrollbar_track_bg: 19
    scrollbar_track_dim: false
    scrollbar_thumb_fg: 37
    scrollbar_thumb_bg: 19
    scrollbar_thumb_bold: false
    status_fg:        252
    status_bg:        19
    status_bold:      false
    status_dim:       false
    border_fg:        252
    border_bg:        19
    focus_bg:         25

  # julia256 — MC upstream Julia256 skin: calm dark grey panel, cyan
  # selection and input, yellow headers.
  # Upstream [core] roles (named terminal colors resolved to fixed 256-color
  # indices, independent of the user's configurable 16-color palette):
  #   _default_ = lightgray;color237 -> normal (index 250 for lightgray)
  #   selected  = black;cyan         -> selected (index 16 for fixed black)
  #   input     = black;cyan         -> prompt
  #   header    = yellow;color237    -> header (index 226 for yellow)
  #   frame     = lightgray;color237 -> border
  julia256:
    normal_fg:        250 # lightgray (#bcbcbc)
    normal_bg:        237 # color237, calm dark grey panel
    selected_fg:      16  # fixed black (#000000)
    selected_bg:      51  # cyan (#00ffff)
    selected_bold:    false
    header_fg:        226 # yellow (#ffff00)
    header_bg:        237
    header_bold:      true
    prompt_fg:        16
    prompt_bg:        51
    placeholder_fg:   243
    placeholder_bg:   51
    placeholder_dim:  false
    scrollbar_track_fg: 237
    scrollbar_track_bg: 237
    scrollbar_track_dim: true
    scrollbar_thumb_fg: 51
    scrollbar_thumb_bg: 237
    scrollbar_thumb_bold: false
    status_fg:        250
    status_bg:        237
    status_bold:      false
    status_dim:       false
    border_fg:        250
    border_bg:        237
    focus_bg:         240 # distinguishable dark grey: between color237 and cyan(51)
