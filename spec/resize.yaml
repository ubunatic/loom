# yaml-language-server: $schema=schemas/resize.schema.json
modes:
  coalesce:
    title: "Resize-event coalescing"
    description: "Drain intermediate SIGWINCH notifications and render only the latest size"
    default: true
    diagnostic_only: false
    key: "1"
  atomic_flush:
    title: "Atomic buffered frame flushes"
    description: "Buffer the complete frame in memory and flush to terminal in a single write"
    default: true
    diagnostic_only: false
    key: "2"
  row_clear:
    title: "Per-row CSI K clearing"
    description: "Emit CSI K at the end of each rendered row to erase stale content after narrowing"
    default: true
    diagnostic_only: false
    key: "3"
  synchronized_output:
    title: "Synchronized output mode"
    description: "Wrap frame flushes in CSI ?2026h / CSI ?2026l for atomic terminal presentation"
    default: true
    diagnostic_only: false
    key: "4"
  auto_wrap:
    title: "Terminal auto-wrap handling"
    description: "Disable terminal auto-wrap (CSI ?7l) while active and restore on exit (CSI ?7h)"
    default: true
    diagnostic_only: false
    key: "5"
  out_of_band_clear:
    title: "Out-of-band resize clearing"
    description: "Emit immediate escape sequence to clear terminal during SIGWINCH handler (diagnostic only)"
    default: false
    diagnostic_only: true
    key: "6"
  full_screen_buffer:
    title: "Full-screen buffer"
    description: "Render from terminal row 1 across the usable screen instead of anchoring at startRow"
    default: true
    diagnostic_only: true
    key: "7"
  resize_handling:
    title: "Resize handling"
    description: "Reflow and redraw the pane when the terminal emits SIGWINCH"
    default: true
    diagnostic_only: false
    key: "8"
  width_guard:
    title: "Resize width guard"
    description: "Render at W-n columns during active SIGWINCH burst to prevent terminal edge-wrap"
    default: true
    diagnostic_only: false
    key: "9"
    guard_n: 1
  adaptive_guard:
    title: "Use WINCH speed"
    description: "Derive the width guard from the measured SIGWINCH rate instead of the manual n; fewer than two events in the window fall back to the manual n"
    default: false
    diagnostic_only: false
    key: "a"
    # events/sec over the span of events inside window_ms; n = min_n + floor(rate / rate_step), clamped to max_n.
    window_ms: 500
    min_n: 1
    max_n: 24
    rate_step: 5
  alt_screen:
    title: "Alternate screen"
    description: "Render on the alternate screen buffer (?1049) from row 1; terminals do not reflow it, so a fast drag cannot wrap old rows into stray lines"
    default: false
    diagnostic_only: false
    key: "b"
