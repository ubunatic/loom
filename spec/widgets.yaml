# yaml-language-server: $schema=schemas/widgets.schema.json
widgets:
  - name: loom.AlignBox
    package: loom
    purpose: Place one child within an aligned and padded rectangle.
    category: layout
    example: |-
      box := loom.NewCenter(child)
      box.Width = 30
      box.Height = 5
    source: align.go
  - name: loom.AnsiEditor
    package: loom
    purpose: Edit styled ANSI cell buffers with cursor navigation and painting.
    category: input
    example: |-
      buffer, _ := loom.ParseAnsiBuffer("hello", 5, 1)
      editor := loom.NewAnsiEditor(buffer)
      frame := &loom.Frame{Boxes: []loom.Box{{Child: editor}}}
      _ = frame
    source: ansieditor.go
    docs: docs/Widgets.md §10
  - name: loom.Box
    package: loom
    purpose: Render a bordered or padded child region.
    category: layout
    example: |-
      box := &loom.Box{Child: child, Title: "Details"}
      frame := &loom.Frame{Boxes: []loom.Box{*box}}
      _ = frame
    source: frame.go
  - name: loom.Chart
    package: loom
    purpose: Plot numeric series with labeled axes as lines or grouped bars.
    category: display
    example: |-
      chart := &loom.Chart{Series: []loom.ChartSeries{
          {Name: "CPU", Values: []float64{20, 35, 28, 52}},
      }}
      frame := &loom.Frame{Boxes: []loom.Box{{Child: chart}}}
    source: chart.go
    docs: docs/Widgets.md §3
    ticket: issues/192
  - name: loom.Choice
    package: loom
    purpose: Filter and select one item from a list.
    category: input
    example: |-
      choice := loom.NewChoice([]loom.Item{
          {Name: "Alpha"},
          {Name: "Beta"},
      })
    source: choice.go
  - name: loom.Confirm
    package: loom
    purpose: Ask for a yes or no response.
    category: input
    example: |-
      confirm := loom.NewConfirm("Delete this item?")
      if confirm.Confirmed() {
          deleteItem()
      }
    source: confirm.go
  - name: loom.DatePicker
    package: loom
    purpose: Navigate and select a bounded date from a month calendar or ISO date input.
    category: input
    example: |-
      selected := time.Date(2024, time.January, 15, 0, 0, 0, 0, time.UTC)
      picker := loom.NewDatePicker(&selected)
      picker.Min = time.Date(2024, time.January, 1, 0, 0, 0, 0, time.UTC)
    source: datepicker.go
    docs: docs/Widgets.md §14
    ticket: issues/175
  - name: loom.Dialog
    package: loom
    purpose: Show a centered or positioned modal with body text and selectable buttons.
    category: input
    example: |-
      dialog := loom.NewDialog("Save changes", "Keep your edits?", "Discard", "Save")
      dialog.OnSelect = func(button string) { fmt.Println(button) }
    source: dialog.go
  - name: loom.FilePicker
    package: loom
    purpose: Navigate directories and select files or directories by glob.
    category: input
    example: |-
      picker, err := loom.NewFilePicker(".", loom.FilePickerOptions{
          Mode: loom.FilePickerFiles, Patterns: []string{"*.go"},
          OnSelect: func(path string) { fmt.Println(path) },
      })
      if err != nil { return err }
      frame := &loom.Frame{Boxes: []loom.Box{{Child: picker}}}
      _ = frame
    source: filepicker.go
    docs: docs/Widgets.md §4
    ticket: issues/172
  - name: loom.Form
    package: loom
    purpose: Arrange, validate, and submit a group of input widgets.
    category: input
    example: |-
      name := loom.NewTextInput("")
      form := loom.NewForm([]loom.FormField{{Label: "Name", Widget: name, Required: true}})
      form.OnSubmit = func(values map[string]any) { fmt.Println(values["Name"]) }
    source: form.go
    docs: docs/Widgets.md §5
    ticket: issues/169
  - name: loom.Frame
    package: loom
    purpose: Arrange boxes and route events to their child widgets.
    category: layout
    example: |-
      frame := &loom.Frame{Boxes: []loom.Box{
          {Child: header}, {Child: body, FillHeight: true},
      }}
    source: frame.go
  - name: loom.Gauge
    package: loom
    purpose: Display a metric value as a bounded bar.
    category: display
    example: |-
      gauge := &loom.Gauge{
          Store: store, Name: "cpu", Min: 0, Max: 100, Width: 10,
      }
    source: widget_graph.go
    docs: docs/Widgets.md §3
  - name: loom.Grid
    package: loom
    purpose: Arrange child widgets in a two-dimensional grid.
    category: layout
    example: |-
      grid := loom.NewGrid(2, header, body, footer)
      focused := grid.Focus()
      _ = focused
    source: grid.go
  - name: loom.KeyHelp
    package: loom
    purpose: Render compact help text from labeled key bindings.
    category: display
    example: |-
      keys := loom.NewKeyMapWithLabels(
          map[string][]string{"quit": {"q"}},
          map[string]string{"quit": "Quit"},
      )
      help := loom.NewKeyHelp(keys)
    source: keyhelp.go
  - name: loom.Menu
    package: loom
    purpose: Display and navigate a one-level dropdown menu.
    category: input
    example: |-
      menu := &loom.Menu{Title: "File", Items: []loom.MenuItem{
          {Label: "Open", Shortcut: "Ctrl+O"},
      }}
    source: menu.go
    ticket: issues/170
  - name: loom.MenuBar
    package: loom
    purpose: Navigate a horizontal menu bar with keyboard, mouse, and shortcut accelerators.
    category: input
    example: |-
      bar := loom.NewMenuBar(loom.Menu{
          Title: "File", Mnemonic: 'F', Items: []loom.MenuItem{
              {Label: "Save", Shortcut: "Ctrl+S", Action: save},
          },
      })
    source: menu.go
    docs: docs/Widgets.md §7
    ticket: issues/170
  - name: loom.Notif
    package: loom
    purpose: Show a non-interactive notification message.
    category: display
    example: |-
      notice := &loom.Notif{Message: "Saved"}
      frame := &loom.Frame{Boxes: []loom.Box{{Child: notice}}}
      _ = frame
    source: notif.go
  - name: loom.NumberInput
    package: loom
    purpose: Edit and step a bounded floating-point value.
    category: input
    example: |-
      value := 5.0
      input := loom.NewNumberInput(&value, 0, 10)
      input.Step = 0.5
    source: numberinput.go
  - name: loom.Paginator
    package: loom
    purpose: Navigate a host-managed collection of pages with keyboard and mouse controls.
    category: input
    example: |-
      paginator := loom.NewPaginator(7)
      paginator.OnChange = func(page int) { offset = page * pageSize }
    source: paginator.go
    docs: docs/Widgets.md §6
    ticket: issues/188
  - name: loom.PaintCanvas
    package: loom
    purpose: Paint braille strokes with optional smoothing, tune controls, and keyboard clearing.
    category: input
    example: |-
      canvas := &loom.PaintCanvas{Smoothing: 2, Controls: true}
      frame := &loom.Frame{Boxes: []loom.Box{{Child: canvas}}}
      _ = frame
    source: paintcanvas.go
  - name: loom.PillCluster
    package: loom
    purpose: Display and navigate a cluster of compact status pills.
    category: display
    example: |-
      pills := loom.NewPillCluster(
          loom.ProviderPill{Label: "CPU", Value: "42%"},
          loom.ProviderPill{Label: "RAM", Value: "3 GB"},
      )
    source: pill.go
  - name: loom.Popup
    package: loom
    purpose: Overlay a child widget on top of the surrounding view.
    category: layout
    example: |-
      popup := loom.NewPopup("Details", dialog)
      popup.Width = 40
      frame := &loom.Frame{Boxes: []loom.Box{{Child: popup}}}
    source: popup.go
  - name: loom.ProgressBar
    package: loom
    purpose: Show and update determinate task progress.
    category: display
    example: |-
      bar := loom.NewProgressBar()
      bar.Set(0.4)
      bar.Set(1)
      bar.Done()
    source: progressbar.go
    docs: docs/Widgets.md §6
    ticket: issues/167
  - name: loom.RichTextEdit
    package: loom
    purpose: Render a styled flow document with cursor, selection, and viewport scrolling.
    category: input
    example: |-
      doc := &loom.RichDocument{Lines: []loom.RichLine{{Spans: []loom.RichSpan{{Text: "hello"}}}}}
      editor := loom.NewRichTextEdit(doc)
      frame := &loom.Frame{Boxes: []loom.Box{{Child: editor}}}
      _ = frame
    source: richtextedit.go
    ticket: issues/254
  - name: loom.Router
    package: loom
    purpose: Route between YAML-declared views.
    category: infra
    example: |-
      widget, config, err := loom.BuildWidgetFile("app.loom.yaml")
      if err != nil {
          return err
      }
      _, _ = widget, config
    source: yaml.go
  - name: loom.Rows
    package: loom
    purpose: Render aligned rows of styled text columns.
    category: display
    example: |-
      rows := &loom.Rows{Columns: []loom.RowColumn{
          {Width: 20}, {Width: 10},
      }}
    source: rows.go
  - name: loom.SearchBar
    package: loom
    purpose: Input and manage filter query, search prompt, placeholder hints, and command-mode actions.
    category: input
    example: |-
      searchBar := loom.NewSearchBar()
      searchBar.Prompt = "> "
      searchBar.Placeholder = "type to filter"
    source: searchbar.go
    ticket: issues/250
  - name: loom.Settings
    package: loom
    purpose: Edit typed settings in a navigable list.
    category: input
    capabilities:
      - KindBool toggle rows
      - KindString text rows
      - KindChoice selection rows
      - KindNumber bounded numeric rows
    example: |-
      enabled, retries := true, 3.0
      settings := loom.NewSettings([]loom.Setting{
          {Label: "Enabled", Kind: loom.KindBool, Bool: &enabled},
          {Label: "Retries", Kind: loom.KindNumber, Num: &retries, Min: 0, Max: 5},
      })
    source: settings.go
  - name: loom.Sparkline
    package: loom
    purpose: Plot recent metric history in a compact inline chart.
    category: display
    example: |-
      chart := &loom.Sparkline{
          Store: store, Name: "cpu", Min: 0, Max: 100, Width: 20,
      }
    source: widget_graph.go
    docs: docs/Widgets.md §3
  - name: loom.Spinner
    package: loom
    purpose: Show a labeled activity indicator that can be started and stopped.
    category: display
    example: |-
      spinner := loom.NewSpinner("Loading")
      spinner.Start()
      frame := &loom.Frame{Boxes: []loom.Box{{Child: spinner}}}
      _ = frame
    source: spinner.go
    docs: docs/Widgets.md §6
    ticket: issues/186
  - name: loom.SplashView
    package: loom
    purpose: Render the current state of a startup splash controller.
    category: display
    example: |-
      view := loom.NewSplashView("Starting")
      frame := &loom.Frame{Boxes: []loom.Box{{Child: view}}}
      _ = frame
    source: splash_view.go
    docs: docs/Widgets.md §5
  - name: loom.Split
    package: loom
    purpose: Divide an area between two child widgets.
    category: layout
    example: |-
      split := loom.NewSplit(left, right)
      split.Orientation = loom.Horizontal
      split.SetRatio(0.4)
      split.MinFirst = 20
    source: split.go
    docs: docs/Widgets.md §1
  - name: loom.Stack
    package: loom
    purpose: Layer child widgets in one shared rectangle.
    category: layout
    example: |-
      stack := loom.NewStack(loom.Vertical, background, dialog)
      stack.Gap = 1
      _ = stack
    source: stack.go
  - name: loom.Stopwatch
    package: loom
    purpose: Display and control elapsed time.
    category: display
    example: |-
      watch := loom.NewStopwatch()
      watch.Start()
      frame := &loom.Frame{Boxes: []loom.Box{{Child: watch}}}
      _ = frame
    source: timer.go
    docs: docs/Widgets.md §6
    ticket: issues/187
  - name: loom.StyledRows
    package: loom
    purpose: Render styled lines without handling input.
    category: display
    example: |-
      rows := loom.NewStyledRows(
          "plain text",
          "\x1b[31mred text\x1b[0m",
      )
    source: styledrows.go
  - name: loom.Table
    package: loom
    purpose: Display, navigate, and select table rows or cells across columns.
    category: input
    example: |-
      table := loom.NewTable(columns, rows)
      table.CellCursor = true
      table.FrozenCols = 1
      table.OnCellSelect = func(int, int) {}
      selected := table.Selected()
      _ = selected
    source: table.go
  - name: loom.Tabs
    package: loom
    purpose: Switch between titled child panels.
    category: layout
    example: |-
      tabs := loom.NewTabs(
          loom.Tab{Title: "Status", Widget: status},
          loom.Tab{Title: "Logs", Widget: logs},
      )
      tabs.Vertical = true
    source: tabs.go
    docs: docs/Widgets.md §2
  - name: loom.TextArea
    package: loom
    purpose: Edit or preview multi-line text with optional syntax highlighting and folding; embedded control drawn by its parent.
    category: input
    example: |-
      area := loom.NewTextArea("line one\nline two")
      area.HandleKey(key)
      area.Draw(canvas, rect, true)
    source: textarea.go
    docs: docs/Widgets.md §9
  - name: loom.TextInput
    package: loom
    purpose: Edit one line of text; embedded control drawn by its parent.
    category: input
    example: |-
      input := loom.NewTextInput("initial")
      input.HandleKey(key)
      input.Draw(canvas, rect, true)
      value := input.Value()
    source: textinput.go
    ticket: issues/173
  - name: loom.Timer
    package: loom
    purpose: Display a controllable countdown with a completion callback.
    category: display
    example: |-
      timer := loom.NewTimer(5 * time.Minute)
      timer.OnDone = func() { fmt.Println("Time is up") }
      timer.Start()
      frame := &loom.Frame{Boxes: []loom.Box{{Child: timer}}}
      _ = frame
    source: timer.go
    docs: docs/Widgets.md §6
    ticket: issues/187
  - name: loom.Toggle
    package: loom
    purpose: Present and change a boolean value.
    category: input
    example: |-
      enabled := false
      toggle := loom.NewToggle(&enabled)
    source: toggle.go
  - name: loom.Tree
    package: loom
    purpose: Navigate and expand a hierarchy of labeled nodes.
    category: input
    example: |-
      tree := loom.NewTree([]*loom.TreeNode{
          {ID: "src", Label: "src", Children: []*loom.TreeNode{{ID: "main", Label: "main.go"}}},
      })
      _ = tree
    source: tree.go
    docs: docs/Widgets.md §6
  - name: loom.View
    package: loom
    purpose: Render and pan through plain or ANSI-styled text lines.
    category: display
    example: |-
      view := loom.NewView([]string{"first line", "second line"})
      view.SetOffset(4, 0)
      view.Pan(2, 1)
      _ = view
    source: view.go
    docs: docs/Widgets.md §11
    ticket: issues/138
  - name: loom.Viewport
    package: loom
    purpose: Scroll a measured child widget through a clipped viewport.
    category: layout
    example: |-
      viewport := loom.NewViewport(loom.NewView(lines))
      viewport.ScrollbarMode = loom.ScrollbarAuto
    source: viewport.go
    docs: docs/Widgets.md §6
  - name: media.Widget
    package: media
    purpose: Render a still image or video frame inside its assigned rectangle.
    category: display
    example: |-
      widget, err := media.LoadImage("photo.png", media.ModeHalfblock)
      if err != nil {
          return err
      }
      frame := &loom.Frame{Boxes: []loom.Box{{Child: widget}}}
    source: media/widget.go
    docs: docs/Widgets.md §12
    ticket: issues/140
exclusions:
  - name: loom.startupRoot
    reason: Unexported startup event-loop wrapper; users compose its public StartupConfig and Pane.RunStartup instead.
  - name: loom.helpWidget
    reason: Unexported command-help UI owned by the command runner.
  - name: examples/*
    reason: Example applications and reusable example widgets are outside the library-only catalog scope.
  - name: internal/*
    reason: Internal implementation packages are outside the public library API.
