# yaml-language-server: $schema=schemas/markup.schema.json
# Named colors for .tui bracket markup. Values are 256-color palette indexes.
# The serializer writes the first name listed for an index.
colors:
  black: 0
  red: 1
  green: 2
  yellow: 3
  blue: 4
  magenta: 5
  cyan: 6
  white: 7
  bright_black: 8
  bright_red: 9
  bright_green: 10
  bright_yellow: 11
  bright_blue: 12
  bright_magenta: 13
  bright_cyan: 14
  bright_white: 15
  grey: 8
  gray: 8
# [image] block tags. modes maps each mode name to its cati renderer; the
# first mode is the default. max_width and max_height cap the size in cells.
image:
  modes:
    half: halfblock
    quad: quadblock
    six: sextant
  max_width: 200
  max_height: 200
