# Topic 3: Bubbles (charm.land/bubbles/v2) and Huh (charm.land/huh/v2) widgets and knobs.
# Source pins: bubbles main 1deada954e6eead9c054837f1cd3d669e912cd4d, huh main ffb6a97195b4a031925a31cc70c62fc1d309e69d
# Both are Bubble Tea v2 libraries (module lines verified). Line numbers come from raw.githubusercontent.com main, grep -n, at research time.
# loom column is left unknown for the host to fill.

- id: bubbles.textarea.word-forward
  area: desktop
  feature: Alt/Ctrl+Right word jump forward in multi-line textarea
  lib: bubbles/textarea
  version: main@1deada9
  symbol: textarea.KeyMap.WordForward
  source_url: https://github.com/charmbracelet/bubbles/blob/1deada954e6eead9c054837f1cd3d669e912cd4d/textarea/textarea.go#L93
  evidence_quote: 'key.NewBinding(key.WithKeys("alt+right", "ctrl+right", "alt+f"), key.WithHelp("alt+right", "word forward"))'
  verified: true
  loom: unknown
  priority: P1
  note: Ctrl+Right and Alt+Right both jump words; Alt+f is the emacs alias.

