- id: lipgloss.layer.z-order
  area: render
  feature: Layers sorted by absolute z-index before drawing
  lib: lipgloss/layer
  version: v2
  symbol: lipgloss.Compositor.flatten
  source_url: https://raw.githubusercontent.com/charmbracelet/lipgloss/main/layer.go#L214-L232
  evidence_quote: '// Sort by absolute z-index (lowest to highest for drawing)'
  verified: true
  loom: unknown
  priority: P1
  note: Z is absolute per layer after flattening the tree; loom RootOverlays/astra order is the comparison point.

