# Ticket 457, topic 1 (TUIOS). Source of every row: github.com/Gaurav-Gosain/tuios at
# commit 6fe2c0df9922b2eec28f392fee4e196efd86be36 (cloned, grepped, line numbers taken from the clone).
# verified: true means the quote was read from that commit. loom: unknown is for the host to fill.
# version: TUIOS uses Bubble Tea v2 only (charm.land/bubbletea/v2 v2.0.10). No v1 import found.

- id: tuios.frame-ticker-cap
  area: perf
  feature: Frame ticker is fixed by Bubble Tea and clamped to 120; TUIOS sets it past the clamp
  lib: bubbletea
  version: v2
  symbol: "tea.WithFPS; (*OS).BindProgram"
  source_url: https://github.com/Gaurav-Gosain/tuios/blob/6fe2c0df9922b2eec28f392fee4e196efd86be36/internal/app/frame_rate.go#L99-L104
  evidence_quote: "Bubble Tea fixes its frame ticker at NewProgram and clamps it to 120. Here"
  verified: true
  loom: unknown
  priority: P2
  note: Their comment says a standing ticker costs idle wake-ups (590/s at 120 vs 370/s at 60). Not measured here.

