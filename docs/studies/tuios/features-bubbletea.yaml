# Topic 2: Bubble Tea v1 and v2. Evidence fetched from GitHub raw files at the tags
# v2.1.1 (charm.land/bubbletea/v2) and v1.3.10 (github.com/charmbracelet/bubbletea).
# teatest: charmbracelet/x at c83711a1 (exp/teatest/v2). loom: unknown for every row (host fills).
- id: bt.send-blocks
  area: events
  feature: Program.Send blocks until the event loop receives the message (unbuffered msgs channel)
  lib: bubbletea
  version: v2
  symbol: tea.Program.Send
  source_url: https://github.com/charmbracelet/bubbletea/blob/v2.1.1/tea.go#L1215-L1220
  evidence_quote: "case p.msgs <- msg:"
  verified: true
  loom: unknown
  priority: P1
  note: high-rate producers stall on Send; compare with Pane.Post (msgs is make(chan Msg), tea.go#L620).

- id: bt.send-blocks.v1
  area: events
  feature: Program.Send blocks on the same unbuffered channel in v1
  lib: bubbletea
  version: v1
  symbol: tea.Program.Send
  source_url: https://github.com/charmbracelet/bubbletea/blob/v1.3.10/tea.go#L774-L779
  evidence_quote: "case p.msgs <- msg:"
  verified: true
  loom: unknown
  priority: P2
  note: same backpressure model as v2; coalescing of high-rate messages not checked.

