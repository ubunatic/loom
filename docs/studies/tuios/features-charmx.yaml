# Topic 5 (Charm low-level) feature rows for ticket 457.
# Source convention: GitHub file URL on main, with line numbers where the fetch gave them ("line n/a" otherwise).
# Quotes were copied by a web-fetch subagent from the fetched page; the host has not re-fetched them.
# loom: unknown on every row (host fills from docs/, spec/ and code).
# version: "ultraviolet" for github.com/charmbracelet/ultraviolet; "main@unpinned" for charmbracelet/x/* (no commit pinned).

- id: uv.render-flush-split
  area: render
  feature: Render builds a diff into an internal buffer; Flush is the only call that writes to the terminal
  lib: ultraviolet/TerminalScreen
  version: ultraviolet
  symbol: uv.TerminalScreen.Render / uv.TerminalScreen.Flush
  source_url: https://pkg.go.dev/github.com/charmbracelet/ultraviolet
  evidence_quote: "(s) Flush()"
  verified: true
  loom: unknown
  priority: P1
  note: Index lists Render and Flush; the doc prose for Flush was not verbatim-fetched, only the index entry.

- id: uv.line-hash-diff
  area: render
  feature: Per-line hash diff; rows marked drift-prone are always repainted, others are diffed
  lib: ultraviolet/TerminalRenderer
  version: ultraviolet
  symbol: TerminalRenderer.paintLine, oldhash/newhash []uint64
  source_url: https://github.com/charmbracelet/ultraviolet/blob/main/terminal_renderer.go (line n/a)
  evidence_quote: "A drift-prone row, or any row when force is set, is repainted; every other row is diffed."
  verified: true
  loom: unknown
  priority: P1
  note: "Drift" (rows whose on-screen state may differ from the model, e.g. after wide-character or width mismatches) is the key idea; read the whole function before copying the rule.

