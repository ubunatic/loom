- id: uv.sync-output-2026
  area: render
  feature: Synchronized output (mode 2026) wraps each Flush; off unless the flag is set
  lib: ultraviolet/TerminalScreen
  version: ultraviolet
  symbol: TerminalScreen.SetSynchronizedUpdates, syncUpdates, ansi.SetModeSynchronizedOutput
  source_url: https://github.com/charmbracelet/ultraviolet/blob/main/terminal_screen.go (line n/a)
  evidence_quote: "buf.WriteString(ansi.SetModeSynchronizedOutput)"
  verified: true
  loom: unknown
  priority: P1
  note: Setter only stores a bool; the sequence is written in Flush and only when the buffer is non-empty. Default-off is from the code reading, not a doc quote.

- id: cellbuf.flush-no-2026
