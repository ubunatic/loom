  lib: tview/Application
  version: main@master
  symbol: tview.Application.SetMouseCapture
  source_url: https://github.com/rivo/tview/blob/master/application.go#L172-L178
  evidence_quote: "SetMouseCapture sets a function which captures mouse events (consisting of"
  verified: true
  loom: partial # e2236900 text_entry.go:338-349 SetFocus and modal_mouse.go:46-95 modal capture; report-mouse.md.
  priority: P1
  note: Returning a nil event consumes it and triggers a redraw. This is a global routing point, similar to loom's pane mouse capture; compare the design.

