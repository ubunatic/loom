  lib: tview/Application
  version: main@master
  symbol: tview.Application.Suspend
  source_url: https://github.com/rivo/tview/blob/master/application.go#L642
  evidence_quote: "func (a *Application) Suspend(f func()) bool {"
  verified: true
  loom: has # e2236900 pane_suspend.go:166-208 Suspend hands off and restores terminal; report-widgets.md.
  priority: P1
  note: Returns false when already suspended, and then does not call f. Compare with loom Pane.Suspend.

- id: tcell.mouse.drag-motion
  area: events
  feature: Click-drag is reported as a motion event while a button is held
  lib: gdamore/tcell v3
  version: main@main
  symbol: tcell.EventMouse
  source_url: https://github.com/gdamore/tcell/blob/main/mouse.go#L20-L22
  evidence_quote: "Hence, click drag can be identified by a motion event with the mouse down,"
  verified: true
  loom: has # e2236900 event.go:525-550 DecodeMouse emits MouseDrag for motion with button; report-mouse.md.
  priority: P1
  note: Some terminals only send press and release, not motion. Drags that leave the bounds depend on this; compare with loom pane drag capture.

