- id: tview.application.paste-no-navigation
  area: events
  feature: Paste events never drive navigation or selection in widgets
  lib: tview/Application
  version: main@master
  symbol: tview.Application.EnablePaste
  source_url: https://github.com/rivo/tview/blob/master/application.go#L251-L254
  evidence_quote: "Widgets won't interpret paste events for navigation or selection purposes."
  verified: true
  loom: has # e2236900 pane_run.go:625-695 paste buffering; report-input.md canary confirms no shortcut.
  priority: P1
  note: Paste is for inserting a block of text into InputField or TextArea only. Relevant to loom's bracketed paste and huge paste handling.

