- id: tcell.kitty-keyboard.enable
  area: events
  feature: Kitty keyboard enabled by query first (CSI ?u), then push with flags
  lib: gdamore/tcell v3
  version: main@main
  symbol: tcell.tScreen (queryKittyKbd, enableKittyKbdAdv)
  source_url: https://github.com/gdamore/tcell/blob/main/tscreen.go#L203-L205
  evidence_quote: "// Technically this pushes"
  verified: true
  loom: partial # e2236900 pane_modes.go:140-165 setKittyKeyboard pushes flag 1 without query; report-queries.md.
  priority: P1
  note: tcell first queries support, then sends CSI =31u (disambiguation, events, alternate keys, all keys, text). loom uses CSI >1u. Compare the flag sets and the query step.

