# Topic 7 (contrast): tview/tcell, gocui, Textual. Source snapshot: master/main on 2026-11-10.
# Line numbers come from raw files downloaded on that date; they can drift when upstream changes.
# loom is "unknown" everywhere: the host fills it from docs/, spec/ and code.

- id: tview.textarea.undo-redo
  area: widgets
  feature: Ctrl-Z undo and Ctrl-Y redo in a multi-line text area
  lib: tview/TextArea
  version: main@master
  symbol: tview.TextArea (undoStack, nextUndo)
  source_url: https://github.com/rivo/tview/blob/master/textarea.go#L179-L180
  evidence_quote: "Ctrl-Z: Undo the last change."
  verified: true
  loom: unknown
  priority: P2
  note: Undo and redo are a stack with an index. Redo is Ctrl-Y, not Ctrl-Shift-Z.

- id: tview.textarea.shift-select
  area: events
  feature: Text selection by holding Shift while moving the cursor
  lib: tview/TextArea
  version: main@master
  symbol: tview.TextArea (selection via Shift)
  source_url: https://github.com/rivo/tview/blob/master/textarea.go#L145-L146
  evidence_quote: "Text can be selected by moving the cursor while holding the Shift key, to the"
  verified: true
  loom: unknown
  priority: P2
  note: The doc adds "to the extent that this is supported by the user's terminal", so Shift-select depends on the terminal.

- id: tview.textarea.copy-is-ctrl-q
  area: desktop
  feature: Copy is Ctrl-Q, because Ctrl-C quits the app
  lib: tview/TextArea
  version: main@master
  symbol: tview.TextArea (clipboard keys)
  source_url: https://github.com/rivo/tview/blob/master/textarea.go#L154-L159
  evidence_quote: "Ctrl-Q: Copy the selected text into the clipboard, unselect the text."
  verified: true
  loom: has # e2236900 text_entry.go:532-537 ConsumeKey passes Ctrl+C without selection; report-widgets.md.
  priority: P1
  note: Copy uses a widget-internal clipboard by default. Line 160 says Ctrl-C is the default key to stop the application. loom uses Ctrl+C for copy, so this is a deliberate contrast.

